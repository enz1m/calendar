[package]
repository = "https://github.com/enz1m/calendar"
name = "calendar-app"
version = "0.1.0"
authors = ["enzUI contributors"]
edition = "2024"
publish = false
license = "MIT"
description = "Manage local events, schedules, and reminders"
rust-version = "1.95"

[workspace]
resolver = "3"

[features]
x11 = ["iced/x11", "enzui-widgets/x11"]
# The native desktop owner prevents concurrent writers and supports presentation.
# Center connections still require an explicitly enrolled app credential.
default = ["center"]
center = ["dep:enzui-agent", "dep:enzui-agent-app"]

[dependencies]
tempfile = "3"
iced = { default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "wayland", "canvas", "svg", "a11y", "tokio"], git = "https://github.com/enz1m/enzim-iced.git", rev = "de6159248c487dddaeec639fe4ec0e7c41c1de2b" }
iced_renderer = { default-features = false, git = "https://github.com/enz1m/enzim-iced.git", rev = "de6159248c487dddaeec639fe4ec0e7c41c1de2b" }
enzui-core = { features = ["accesskit", "activation-native-iced"], git = "https://github.com/enz1m/enzui.git", rev = "a8310925b96e8ef28deafc7234371e31225d2d4e" }
enzui-parent-lease = { git = "https://github.com/enz1m/enzui.git", rev = "a8310925b96e8ef28deafc7234371e31225d2d4e" }
enzui-wayland = { git = "https://github.com/enz1m/enzui.git", rev = "a8310925b96e8ef28deafc7234371e31225d2d4e" }
enzui-services = { git = "https://github.com/enz1m/enzui.git", rev = "a8310925b96e8ef28deafc7234371e31225d2d4e" }
enzui-theme = { git = "https://github.com/enz1m/enzui.git", rev = "a8310925b96e8ef28deafc7234371e31225d2d4e" }
enzui-widgets = { features = ["portal-dbus", "application-dbus"], git = "https://github.com/enz1m/enzui.git", rev = "a8310925b96e8ef28deafc7234371e31225d2d4e" }
enzui-agent = { features = ["iced-consumer"], optional = true, git = "https://github.com/enz1m/enzui.git", rev = "a8310925b96e8ef28deafc7234371e31225d2d4e" }
# Desktop ownership and windowless activation share the same application state.
enzui-agent-app = { optional = true, git = "https://github.com/enz1m/enzui.git", rev = "a8310925b96e8ef28deafc7234371e31225d2d4e" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Event-date offset resolution supplements the framework's zoneless civil dates.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
[dev-dependencies]
iced_test = { git = "https://github.com/enz1m/enzim-iced.git", rev = "de6159248c487dddaeec639fe4ec0e7c41c1de2b" }

[patch.crates-io]
zbus_macros = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "815a9ca7b64aa24e14ccb6ea3f7eda97ef7bbc8a" }
zbus_names = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "815a9ca7b64aa24e14ccb6ea3f7eda97ef7bbc8a" }
zvariant = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "815a9ca7b64aa24e14ccb6ea3f7eda97ef7bbc8a" }
zvariant_derive = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "815a9ca7b64aa24e14ccb6ea3f7eda97ef7bbc8a" }
zvariant_utils = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "815a9ca7b64aa24e14ccb6ea3f7eda97ef7bbc8a" }
zbus = { git = "https://github.com/enz1m/enzim-zbus.git", rev = "815a9ca7b64aa24e14ccb6ea3f7eda97ef7bbc8a" }
winit = { git = "https://github.com/enz1m/enzim-winit.git", rev = "f6ce16941bf815a438db7e628ab1126ce48e31dd" }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(docsrs)"] }
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
return_self_not_must_use = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
trivially_copy_pass_by_ref = "warn"
large_stack_arrays = "warn"
ref_option = "warn"
implicit_clone = "warn"
assigning_clones = "warn"
or_fun_call = "warn"
cast_lossless = "warn"
significant_drop_in_scrutinee = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
explicit_iter_loop = "warn"
ignored_unit_patterns = "warn"
unused_async = "warn"
string_slice = "warn"
unwrap_in_result = "warn"
panic = "warn"
iter_over_hash_type = "warn"
allow_attributes_without_reason = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_assert_message = "warn"
str_to_string = "warn"
format_push_string = "warn"
redundant_type_annotations = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = 0
incremental = false

[profile.test.package."*"]
opt-level = 2
debug = 0
incremental = false

[profile.release]
lto = false
codegen-units = 16
debug = 0
strip = "debuginfo"
