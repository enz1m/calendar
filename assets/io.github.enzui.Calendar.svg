<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Calendar</title>
  <defs>
    <filter id="enz-calendar-drop" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="blur"/>
      <feComponentTransfer in="blur" result="shadow">
        <feFuncA type="linear" slope="0.28"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- square keyline; sheet 76 x 82 at (26 26); red band 22 px; binding rings 6 x 14; 4 x 3 day grid -->
  <g filter="url(#enz-calendar-drop)">
    <rect x="26" y="30" width="76" height="82" rx="9" fill="#F27E7E" transform="rotate(4 64 70)"/>
    <path d="M26 35 A9 9 0 0 1 35 26 H93 A9 9 0 0 1 102 35 V48 H26 Z" fill="#EF4444"/>
    <path d="M26 48 H102 V99 A9 9 0 0 1 93 108 H35 A9 9 0 0 1 26 99 Z" fill="#FFFFFF"/>
  </g>
  <g fill="#B72A2A">
    <circle cx="46" cy="34" r="4"/>
    <circle cx="82" cy="34" r="4"/>
  </g>
  <g fill="#2B3140">
    <rect x="43" y="21" width="6" height="14" rx="3"/>
    <rect x="79" y="21" width="6" height="14" rx="3"/>
  </g>
  <g fill="#DCE2EC">
    <rect x="34" y="56" width="12" height="12" rx="3"/>
    <rect x="50" y="56" width="12" height="12" rx="3"/>
    <rect x="66" y="56" width="12" height="12" rx="3"/>
    <rect x="82" y="56" width="12" height="12" rx="3"/>
    <rect x="34" y="72" width="12" height="12" rx="3"/>
    <rect x="50" y="72" width="12" height="12" rx="3"/>
    <rect x="82" y="72" width="12" height="12" rx="3"/>
    <rect x="34" y="88" width="12" height="12" rx="3"/>
    <rect x="50" y="88" width="12" height="12" rx="3"/>
  </g>
  <rect x="66" y="72" width="12" height="12" rx="3" fill="#EF4444"/>
</svg>
